name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -x -q
      - name: Verify README links
        run: |
          python - <<'EOF'
          import re, pathlib
          readme = pathlib.Path("README.md").read_text()
          for m in re.finditer(r'\]\(([^)]+)\)', readme):
              link = m.group(1)
              if link.startswith("http") or link.startswith("#"):
                  continue
              p = pathlib.Path(link.split("#")[0])
              assert p.exists(), f"broken link: {link}"
          print("all local links OK")
          EOF
