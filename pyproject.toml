[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiiv"
version = "0.1.0"
description = "XIIV - a tiny discrete-diffusion language model (10M params, CPU-runnable) with constraint-native generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CYPHERLYNX" }]
keywords = ["diffusion", "language-model", "tiny-ml", "on-device-ai", "infill"]
dependencies = [
    "torch==2.14.1",
    "tokenizers==0.23.2",
    "numpy==2.5.3",
    "safetensors==0.8.0",
]

[project.urls]
Homepage = "https://github.com/CYPHERLYNX/XIIV"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["xiiv*"]
